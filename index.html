<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jennifer5 Open API</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@4.6.2/swagger-ui.css">
    <style>
    /* 기존 */
    .swagger-ui .topbar { display: none }
    .opblock .opblock-summary-path-description-wrapper {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 0 10px;
        padding: 0 10px;
        width: 100%;
    }

    /* 모바일 기본 대응 */
    body { overflow-x: hidden; }
    .swagger-ui .wrapper {
        padding: 0 10px;
        box-sizing: border-box;
        max-width: 100vw;
        overflow-x: hidden;
    }
    .swagger-ui .info { word-break: break-word; }
    .swagger-ui .opblock .opblock-summary { flex-wrap: wrap; }
    .swagger-ui .opblock .opblock-summary-path {
        max-width: 100%;
        word-break: break-all;
        white-space: normal;
        min-width: 0;
    }
    .swagger-ui table td, .swagger-ui table th { word-break: break-word; }
    .swagger-ui .opblock-body pre {
        overflow-x: auto;
        max-width: calc(100vw - 40px);
    }

    /* Authorize / Scheme 영역 */
    .swagger-ui .scheme-container {
        padding: 10px;
        flex-wrap: wrap;
        overflow: hidden;
    }
    .swagger-ui .scheme-container .schemes { flex-wrap: wrap; gap: 8px; }
    .swagger-ui .btn.authorize {
        max-width: 100%;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* 모바일 미디어 쿼리 */
    @media (max-width: 768px) {
        .swagger-ui .opblock .opblock-summary {
            flex-direction: column;
            align-items: flex-start;
        }
        .swagger-ui .opblock .opblock-summary-method { margin-bottom: 5px; }
        .swagger-ui .scheme-container {
            flex-direction: column;
            align-items: flex-start;
        }
        .swagger-ui .scheme-container .schemes {
            width: 100%;
            flex-direction: column;
        }
        .swagger-ui .scheme-container .schemes > * { width: 100%; }
        .swagger-ui .scheme-container .schemes select { width: 100%; }
        .swagger-ui .btn.authorize { width: 100%; box-sizing: border-box; }
        .swagger-ui .auth-wrapper { width: 100%; justify-content: flex-start; }
        .swagger-ui .information-container { padding: 0; }
    }
</style>
</head>
